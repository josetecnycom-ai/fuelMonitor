<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Informe de Consumo de Combustible</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        /* Aislamiento de estilos e integración con UI MyGeotab */
        #fuel-addin-root, #fuel-addin-root * {
            box-sizing: border-box !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
        }
        #fuel-addin-root {
            padding: 24px;
            background-color: #f4f6f8;
            min-height: 100vh;
            color: #212529;
        }
        #fuel-addin-root .page-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        #fuel-addin-root .page-header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: #2b537d;
        }
        #fuel-addin-root .filter-card {
            background: #ffffff;
            border: 1px solid #dce2e6;
            border-radius: 6px;
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        #fuel-addin-root .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }
        #fuel-addin-root .ctrl-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #fuel-addin-root .ctrl-group label {
            font-size: 11px;
            font-weight: 700;
            color: #5a6a75;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #fuel-addin-root .radio-group {
            display: flex;
            align-items: center;
            gap: 16px;
            height: 36px;
        }
        #fuel-addin-root .radio-group label {
            font-size: 13px !important;
            font-weight: 500 !important;
            text-transform: none !important;
            color: #212529 !important;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #fuel-addin-root .ctrl-input {
            height: 36px !important;
            padding: 4px 10px !important;
            border: 1px solid #cccccc !important;
            border-radius: 4px !important;
            font-size: 13px !important;
            background-color: #ffffff !important;
            color: #212529 !important;
            outline: none !important;
            transition: border-color 0.15s ease-in-out;
        }
        #fuel-addin-root .ctrl-input:focus {
            border-color: #2b537d !important;
            box-shadow: 0 0 0 2px rgba(43, 83, 125, 0.15);
        }
        #fuel-addin-root select.ctrl-input {
            min-width: 260px;
            max-width: 380px;
        }
        #fuel-addin-root input[type="date"].ctrl-input {
            width: 150px !important;
        }
        #fuel-addin-root .btn-primary {
            height: 36px;
            padding: 0 18px;
            background-color: #2b537d;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.15s ease-in-out;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        #fuel-addin-root .btn-primary:hover {
            background-color: #1f3e5e;
        }
        #fuel-addin-root .btn-excel {
            height: 36px;
            padding: 0 18px;
            background-color: #1d7a44;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.15s ease-in-out;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        #fuel-addin-root .btn-excel:hover {
            background-color: #145730;
        }
        #fuel-addin-root table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #dce2e6;
        }
        #fuel-addin-root th {
            background: #eef2f6;
            text-align: left;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 700;
            color: #2b537d;
            border-bottom: 2px solid #dce2e6;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        #fuel-addin-root td {
            padding: 10px 14px;
            border-bottom: 1px solid #eef2f6;
            font-size: 13px;
            color: #333333;
        }
        #fuel-addin-root tr:nth-child(even) td {
            background-color: #fafbfc;
        }
        #fuel-addin-root tr:hover td {
            background-color: #f0f4f8;
        }
        .card-result {
            background: #ffffff;
            border: 1px solid #dce2e6;
            border-radius: 6px;
            padding: 18px;
            margin-top: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .card-result h3 {
            margin: 0 0 14px 0;
            font-size: 15px;
            font-weight: 600;
            color: #2b537d;
        }
        .badge-avg {
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .badge-good { color: #15803d; background: #f0fdf4; }
        .badge-high { color: #b91c1c; background: #fef2f2; }
    </style>
</head>
<body>
    <div id="fuel-addin-root">
        <div class="page-header">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="#2b537d"><path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33 0 1.38 1.12 2.5 2.5 2.5.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
            <h2>Informe de Consumo de Combustible</h2>
        </div>
        
        <div class="filter-card">
            <div class="controls-row">
                <div class="ctrl-group">
                    <label>Filtrar por</label>
                    <div class="radio-group">
                        <label><input type="radio" id="modeVehicle" name="searchMode" value="Device" checked> Vehículos</label>
                        <label><input type="radio" id="modeDriver" name="searchMode" value="User"> Conductores</label>
                    </div>
                </div>

                <div class="ctrl-group">
                    <label for="entitySelect">Seleccionar Activo / Conductor</label>
                    <select id="entitySelect" class="ctrl-input">
                        <option value="ALL">-- TODOS --</option>
                    </select>
                </div>

                <div class="ctrl-group">
                    <label for="dateFrom">Desde</label>
                    <input type="date" id="dateFrom" class="ctrl-input">
                </div>

                <div class="ctrl-group">
                    <label for="dateTo">Hasta</label>
                    <input type="date" id="dateTo" class="ctrl-input">
                </div>

                <div style="display: flex; gap: 8px; margin-left: auto;">
                    <button id="btn-fetch-data" class="btn-primary">Generar Informe</button>
                    <button id="btn-export-excel" class="btn-excel" style="display: none;">Exportar Excel</button>
                </div>
            </div>
        </div>

        <div id="results-panel"></div>

        <div id="chartWrapper" class="card-result" style="display: none;">
            <div style="position: relative; height: 320px;">
                <canvas id="fuelChart"></canvas>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
