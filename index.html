<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Informe de Consumo de Combustible</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    
    <!-- Estilos inyectados dentro de body para evitar borrado de head por MyGeotab -->
    <style>
        .fuel-container * { box-sizing: border-box !important; }
        .fuel-input-ctrl {
            height: 36px !important;
            padding: 4px 10px !important;
            border: 1px solid #cccccc !important;
            border-radius: 4px !important;
            font-size: 13px !important;
            background-color: #ffffff !important;
            color: #212529 !important;
            outline: none !important;
        }
        .fuel-input-ctrl:focus {
            border-color: #2b537d !important;
            box-shadow: 0 0 0 2px rgba(43, 83, 125, 0.15) !important;
        }
        .fuel-btn-main {
            height: 36px;
            padding: 0 16px;
            background-color: #2b537d;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .fuel-btn-main:hover { background-color: #1f3e5e; }
        .fuel-btn-excel {
            height: 36px;
            padding: 0 16px;
            background-color: #1d7a44;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .fuel-btn-excel:hover { background-color: #145730; }
        .fuel-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #dce2e6;
            margin-top: 10px;
        }
        .fuel-table th {
            background: #eef2f6;
            text-align: left;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 700;
            color: #2b537d;
            border-bottom: 2px solid #dce2e6;
            text-transform: uppercase;
        }
        .fuel-table td {
            padding: 10px 14px;
            border-bottom: 1px solid #eef2f6;
            font-size: 13px;
            color: #333333;
        }
        .fuel-table tr:nth-child(even) td { background-color: #fafbfc; }
        .fuel-table tr:hover td { background-color: #f0f4f8; }
    </style>

    <div class="fuel-container" id="fuel-addin-root" style="padding: 20px; background-color: #f4f6f8; min-height: 100vh;">
        
        <!-- Cabecera -->
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 18px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#2b537d"><path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33 0 1.38 1.12 2.5 2.5 2.5.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
            <h2 style="margin: 0; font-size: 20px; font-weight: 600; color: #2b537d;">Informe de Consumo de Combustible</h2>
        </div>
        
        <!-- Tarjeta de Filtros -->
        <div style="background: #ffffff; border: 1px solid #dce2e6; border-radius: 6px; padding: 16px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);">
            <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;">
                
                <!-- Modo -->
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-size: 11px; font-weight: 700; color: #5a6a75; text-transform: uppercase;">Filtrar por</label>
                    <div style="display: flex; align-items: center; gap: 14px; height: 36px;">
                        <label style="font-size: 13px; color: #212529; cursor: pointer; display: flex; align-items: center; gap: 4px;">
                            <input type="radio" id="modeVehicle" name="searchMode" value="Device" checked> Vehículos
                        </label>
                        <label style="font-size: 13px; color: #212529; cursor: pointer; display: flex; align-items: center; gap: 4px;">
                            <input type="radio" id="modeDriver" name="searchMode" value="User"> Conductores
                        </label>
                    </div>
                </div>

                <!-- Selección de Activo -->
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-size: 11px; font-weight: 700; color: #5a6a75; text-transform: uppercase;">Seleccionar Activo / Conductor</label>
                    <select id="entitySelect" class="fuel-input-ctrl" style="min-width: 250px; max-width: 350px;">
                        <option value="ALL">-- TODOS --</option>
                    </select>
                </div>

                <!-- Desde / Hasta -->
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-size: 11px; font-weight: 700; color: #5a6a75; text-transform: uppercase;">Desde</label>
                    <input type="date" id="dateFrom" class="fuel-input-ctrl" style="width: 140px;">
                </div>

                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-size: 11px; font-weight: 700; color: #5a6a75; text-transform: uppercase;">Hasta</label>
                    <input type="date" id="dateTo" class="fuel-input-ctrl" style="width: 140px;">
                </div>

                <!-- PARAMETRIZACIÓN DEL UMBRAL -->
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-size: 11px; font-weight: 700; color: #5a6a75; text-transform: uppercase;">Umbral Alerta (L/100km)</label>
                    <input type="number" id="thresholdLimit" class="fuel-input-ctrl" value="30.0" step="0.5" min="0" style="width: 150px; font-weight: 600; color: #b91c1c;">
                </div>

                <!-- Botones -->
                <div style="display: flex; gap: 8px; margin-left: auto;">
                    <button id="btn-fetch-data" class="fuel-btn-main">Generar Informe</button>
                    <button id="btn-export-excel" class="fuel-btn-excel" style="display: none;">Exportar Excel</button>
                </div>
            </div>
        </div>

        <!-- Panel de Resultados -->
        <div id="results-panel"></div>

        <!-- Gráfico -->
        <div id="chartWrapper" style="display: none; background: #ffffff; border: 1px solid #dce2e6; border-radius: 6px; padding: 16px; margin-top: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);">
            <div style="position: relative; height: 320px;">
                <canvas id="fuelChart"></canvas>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
